# .github/workflows/ci.yml
name: Bundle deploy Prod
concurrency: 
  group: deploy-prod
  cancel-in-progress: false
on:
  workflow_run:
    workflows: ['Bundle deploy dev']   # ← must match the `name:` in dev yml exactly
    types: [completed]

jobs:
  deploy-prod:
    name: 'Deploy DAB Bundle'
    runs-on: ubuntu-latest
    
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production        # ← this triggers the approval gate

    defaults:
     run:
        working-directory: RetailCo_dev
    env:
      # DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        
      - run: echo "Validating the bundle to production..."
      - name: validating bundle
        run: databricks bundle validate --target prod
        working-directory: RetailCo_dev
        env:
          DATABRICKS_HOST: ${{secrets.prod_host}}
          DATABRICKS_TOKEN: ${{secrets.prod_token}}
          DATABRICKS_BUNDLE_ENV: prod

      - run: echo "summarize the bundle to production..."
      - name: summarize bundle
        run: databricks bundle summary --target prod
        working-directory: RetailCo_dev
        env:
          DATABRICKS_HOST: ${{secrets.prod_host}}
          DATABRICKS_TOKEN: ${{secrets.prod_token}}
          DATABRICKS_BUNDLE_ENV: prod
      
      - run: echo "Deploying to production..."
      - name: deploy bundle
        run: databricks bundle deploy --target prod
        working-directory: RetailCo_dev
        env:
          DATABRICKS_HOST: ${{secrets.prod_host}}
          DATABRICKS_TOKEN: ${{secrets.prod_token}}
          DATABRICKS_BUNDLE_ENV: prod

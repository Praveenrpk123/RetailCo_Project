[project]
name = "RetailCo_dev"
version = "0.0.1"
authors = [{ name = "mallikaravipp11@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

[project.scripts]
main = "RetailCo_dev.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["RetailCo_Project/RetailCo_dev"] 

[tool.ruff]
exclude = [
    "src/Bronze/Bronze_demo.py",
    "src/Silver/Silver_orders.py"
]

[tool.ruff.lint]
ignore = ["F821", "EXE002", "SIM102"]


[tool.databricks.environment]
environment_version = '6'